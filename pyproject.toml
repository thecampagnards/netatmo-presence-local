[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "RUF"]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "RUF012", # Home Assistant entity classes assign mutable _attr_ defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D102", "D103", "D107"]  # test methods document themselves by name

[tool.ruff.lint.isort]
# Home Assistant writes `from x import a as b, c as d` on one line; without
# this ruff splits every aliased import onto its own.
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
